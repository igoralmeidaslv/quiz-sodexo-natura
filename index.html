<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#283897">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz Natura">
<meta name="robots" content="noindex, nofollow">
<title>Quiz Sodexo Natura</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" media="print" onload="this.media='all'">
<style>
/* Sodexo identity: logo blue + red star, white brand bar. Layout: mobile-first single column for the team (keypad → placar → quiz); wide multi-column panel for management. */
:root{
  --bg:#F2F4FA;--surface:#FFFFFF;--sunk:#E7EAF4;--ink:#2A295C;--muted:#5B6285;--line:#D9DDEC;
  --brand:#283897;--brand-ink:#FFFFFF;--accent:#DA2020;--accent-soft:#E4E8F8;--accent-ink:#1E2B7A;
  --ok:#17845A;--ok-soft:#DDF2E8;--bad:#C0362C;--bad-soft:#FBE3E0;--bar:#FFFFFF;--bar-ink:#283897;
  --display:'Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1130;--surface:#161C45;--sunk:#10153A;--ink:#E6E9F8;--muted:#9AA2CC;--line:#262E63;
  --brand:#3A4DC4;--brand-ink:#FFFFFF;--accent:#FF5A4E;--accent-soft:#1F2A6B;--accent-ink:#D3DAFF;
  --ok:#4CC38F;--ok-soft:#113426;--bad:#FF7A6E;--bad-soft:#3C1714;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1130;--surface:#161C45;--sunk:#10153A;--ink:#E6E9F8;--muted:#9AA2CC;--line:#262E63;
  --brand:#3A4DC4;--brand-ink:#FFFFFF;--accent:#FF5A4E;--accent-soft:#1F2A6B;--accent-ink:#D3DAFF;
  --ok:#4CC38F;--ok-soft:#113426;--bad:#FF7A6E;--bad-soft:#3C1714;color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1120px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--brand);box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:900;font-size:19px;flex:1;min-width:0;color:var(--bar-ink)}
.brand img{height:30px;width:auto;flex:none}
.brand .sep{width:1px;height:30px;background:#C9CEE6;flex:none}
.brand .q{line-height:1.05;letter-spacing:-.01em;min-width:0}
.brand .q span{color:#DA2020}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5B6285}
.ghost{background:transparent;border:1.5px solid #283897;color:#283897;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}

main{padding-block:20px 48px}
.stack{display:flex;flex-direction:column;gap:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-size:19px}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink);min-height:48px}
.btn.alt{background:var(--sunk);color:var(--ink)}
.btn.warn{background:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--brand);font-weight:600;text-decoration:underline;padding:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--accent)}}
:root[data-theme="dark"] .link{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:28px}
.login h1{font-size:28px}
.dots{display:flex;gap:14px;margin:18px 0 6px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand);transition:background .12s}
.dot.on{background:var(--brand)}
.err{color:var(--bad);font-weight:600;min-height:24px;margin:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:320px;margin:10px 0 18px}
.pad button{height:68px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:600;font-size:28px;box-shadow:0 1px 0 var(--line)}
.pad button:active{background:var(--sunk);transform:translateY(1px)}
.pad .blank{visibility:hidden}
.pad .bk{font-size:20px;font-family:var(--body);font-weight:600;color:var(--muted)}

/* Avatars */
.av{border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;overflow:hidden;background:var(--brand)}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* Score hero */
.score{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:end;position:relative;overflow:hidden}
.score::after{content:"";position:absolute;right:-36px;top:-36px;width:150px;height:150px;border-radius:50%;background:#FFFFFF;opacity:.08}
.score::before{content:"";position:absolute;right:18px;top:16px;width:14px;height:14px;background:var(--accent);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.score .lbl{font-size:13px;font-weight:600;opacity:.85;grid-column:1/-1}
.score .pts{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.score .pts span{font-size:20px;font-weight:600;margin-left:4px;opacity:.85}
.score .pos{text-align:right;position:relative;z-index:1;padding-top:14px}
.score .pos b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.score .meta{grid-column:1/-1;font-size:14px;opacity:.9;margin-top:6px}

/* Quiz list */
.qitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:64px}
.qitem .t{flex:1;min-width:0;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.gold{background:var(--accent-soft);color:var(--accent-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.off{background:var(--sunk);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.done{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
.done:last-child{border-bottom:0}
.done .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:22px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* Ranking rows */
.rk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px}
.rk:nth-child(odd){background:var(--sunk)}
.rk.me{background:var(--accent-soft);color:var(--accent-ink)}
.rk .p{width:28px;font-family:var(--display);font-weight:800;font-size:18px;text-align:center}
.rk .n{flex:1;min-width:0}
.rk .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .n small{color:var(--muted);font-size:13px}
.rk.me .n small{color:inherit;opacity:.8}
.rk .v{font-family:var(--display);font-weight:800;font-size:18px}
.rk .v small{font-family:var(--body);font-weight:600;font-size:12px;opacity:.7}

/* Quiz screen */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qtext{font-size:24px;margin:14px 0 18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;min-height:60px}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.opt.sel{border-color:var(--brand)}
.opt.sel .l{background:var(--brand);color:var(--brand-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.verdict{border-radius:14px;padding:14px 16px;font-weight:700;font-size:17px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.sticky-cta{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* Admin */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=number],input[type=month],input[type=tel],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
select{width:auto}
textarea{min-height:84px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pd.p1{background:var(--accent-soft);border-color:var(--accent);padding-block:20px}
.pd .medal{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pd.p1 .medal{color:var(--accent-ink)}
.pd .nm{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .pt{font-family:var(--display);font-weight:800;font-size:22px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.card .qq{font-weight:700;font-size:16px}
.card ol{margin:0;padding-left:20px;font-size:14px;color:var(--muted)}
.card ol li.c{color:var(--ok);font-weight:700}
.pinv{font-family:var(--display);font-weight:800;letter-spacing:.2em}
.notice{background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:14px 16px;font-size:15px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(5,20,16,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px;padding:24px}}
.sheet h2{font-size:22px;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label,.fld .lb{font-weight:600;font-size:14px}
.fld .hint{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.optrow{display:flex;align-items:center;gap:10px}
.optrow input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.photo{display:flex;align-items:center;gap:14px}
.ferr{color:var(--bad);font-weight:600;min-height:22px;margin:0 0 8px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--brand)}

.foot{background:#2A295C;color:#E4E6F4;margin-top:8px}
.foot .wrap{padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.foot.wide .wrap{max-width:1120px}
.foot .fl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.foot img{height:26px;width:auto}
.foot .tag{font-family:var(--display);font-weight:800;font-size:15px;color:#fff}
.foot .disc{border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;max-width:68ch}
.foot .disc b{color:#fff}
.foot .small{font-size:12px;color:#A9AED3}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}

@media (max-width:420px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:22px}.qtext{font-size:21px}.score .pts{font-size:48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}html{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
.demo{background:#FFF1CC;color:#5A4200;font-size:13px;font-weight:700;text-align:center;padding:7px 16px}
#confete{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 0;color:var(--muted);font-weight:600}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pad.busy{opacity:.5;pointer-events:none}
a.btn{text-decoration:none}
.pd .medal-e{font-size:30px;line-height:1}
.pd .prz{font-size:12px;color:var(--muted);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}

/* Navegação inferior (equipe) */
body.has-nav main{padding-bottom:110px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.bnav .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:560px}
.bnav button{background:none;border:0;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.bnav button .ic{font-size:21px;line-height:1.1}
.bnav button.on{color:var(--brand);background:var(--accent-soft)}
.bnav .dotn{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--accent)}

/* Checklist */
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:58px}
.chk .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:900;color:transparent}
.chk.on{border-color:var(--ok);background:var(--ok-soft)}
.chk.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.chk .t{flex:1;min-width:0}
.chk .t b{display:block;font-size:15px}
.chk .t small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);color:var(--accent-ink);border:1.5px solid var(--brand);border-radius:16px;padding:14px 16px;font-weight:700}
.cta .ic{font-size:26px}
.miss{color:var(--bad);font-size:14px;font-weight:600}

/* Avaliação (gestão) */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .dt{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:18px;text-transform:capitalize}
.datebar .nb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:800}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:800;font-size:13px;color:var(--muted);line-height:1.2}
.seg button small{display:block;font-weight:700;font-size:11px;opacity:.85}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.pcard.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pcard .hd{display:flex;align-items:center;gap:10px}
.pcard .hd .nm{flex:1;min-width:0}
.pcard .hd .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .hd .nm small{color:var(--muted);font-size:12.5px}
.pcard .sc{font-family:var(--display);font-weight:900;font-size:20px;text-align:right;line-height:1}
.pcard .sc small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted)}
.crits{display:flex;flex-wrap:wrap;gap:8px}
.crit{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.crit .v{font-size:12px;opacity:.8}
.crit.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pcard .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.saved{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:auto}
.saved.ok{color:var(--ok)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.grid3>section{min-width:0}
.qblock{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);margin-bottom:12px}
.qblock .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800}
.qprog{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.corr{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.corr:last-child{border-bottom:0}
.corr .ic{flex:none;font-weight:900}
.prizes{display:grid;gap:8px}
.prize{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.prize .m{font-size:22px}
.daylist .done .t{white-space:normal}
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#17B26A;box-shadow:0 0 0 0 rgba(23,178,106,.6);animation:pulse 1.6s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(23,178,106,.55)}70%{box-shadow:0 0 0 8px rgba(23,178,106,0)}100%{box-shadow:0 0 0 0 rgba(23,178,106,0)}}
.onl{display:flex;flex-wrap:wrap;gap:8px}
.onp{display:flex;align-items:center;gap:10px;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:999px;padding:5px 12px 5px 5px}
.onp b{display:block;font-size:14px;line-height:1.1}.onp small{display:block;font-size:12px;color:var(--muted)}
.hbars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:6px}
.hb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.hb i{display:block;width:100%;min-height:2px;background:var(--brand);border-radius:4px 4px 0 0;opacity:.8}
.hb i.pk{background:#EB6619;opacity:1}
.hb small{font-size:10px;color:var(--muted);height:12px;line-height:12px}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none;display:inline-block}
.btn .i,.link .i{width:1.1em;height:1.1em}
.med{display:inline-grid;place-items:center;min-width:2em;height:2em;padding:0 .2em;border-radius:999px;font-family:var(--display);font-weight:900;font-size:.78em;line-height:1;color:#fff;vertical-align:middle;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.med.m1{background:linear-gradient(#F4C85A,#D49A1C)}.med.m2{background:linear-gradient(#CBD2DD,#94A0B4)}.med.m3{background:linear-gradient(#DDA57E,#AE6A3C)}
.pd .medal-e .med{font-size:17px}
.prize .m .med{font-size:14px}
.bnav button .ic .i{width:23px;height:23px}
.cta .ic .i{width:28px;height:28px}
.chk .bx .i,.titem .bx .i{width:16px;height:16px;stroke-width:3.2}
.corr .ic .i{width:18px;height:18px;stroke-width:3}
.ccat h3 .i{width:20px;height:20px;color:var(--brand)}
.citem .th .i{width:20px;height:20px;color:var(--muted)}
.bellbox .ic .i{width:26px;height:26px}
.mthumb.add .i{width:30px;height:30px;margin-bottom:4px}
.ltask li .b .i{width:14px;height:14px;stroke-width:3}
.ltask .meta .i,.tcard .i{width:14px;height:14px}
.tcard .chip .i,.ltask .chip .i{width:13px;height:13px;stroke-width:3}
.citem button .i{width:17px;height:17px}
.tch .ic{color:#283897}.tc.light .tch .ic{color:#2B8A57}
.tch .ic .i{width:1em;height:1em;stroke-width:2.2}
.ti .ph .i{width:1em;height:1em;color:#9AA2CC;stroke-width:1.4}
.tvref .i{width:1em;height:1em;stroke-width:2.4}
.sbh .e .i{width:1em;height:1em;stroke-width:1.8}
.tvfs .i{width:18px;height:18px}

/* ===== Cardápio (gestão) ===== */
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ccat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ccat h3{font-size:16px;display:flex;align-items:center;gap:8px}
.ccat h3 .n{margin-left:auto;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}
.citems{display:flex;flex-direction:column;gap:6px}
.citem{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:12px;padding:6px 8px;min-height:48px}
.citem .th{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--surface);font-size:20px}
.citem .th img{width:100%;height:100%;object-fit:cover}
.citem .nm{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.citem button{background:var(--surface);border:1px solid var(--line);border-radius:9px;min-width:36px;height:36px;font-size:15px;font-weight:800;color:var(--muted)}
.cadd{display:flex;gap:8px}
.cadd input{flex:1;min-width:0}
.cstatus{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.cstatus.on{border-color:var(--ok);background:var(--ok-soft)}
.cstatus .t{flex:1;min-width:220px}
.cstatus .t b{display:block;font-size:16px}
.cstatus .t small{color:var(--muted);font-size:13px}
.switch{position:relative;width:58px;height:34px;border-radius:99px;background:var(--line);border:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch.on{background:var(--ok)}
.switch.on::after{left:28px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.mthumb{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.mthumb button{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:800}
.mthumb.add{display:grid;place-items:center;text-align:center;font-weight:700;color:var(--muted);cursor:pointer;border-style:dashed;padding:8px;font-size:14px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.urlbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.urlbox code{flex:1;min-width:200px;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;word-break:break-all}
.prev-wrap{width:100%;max-width:340px;margin:0 auto;aspect-ratio:9/16;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}

/* ===== Limpeza ===== */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lcard .hd{display:flex;align-items:center;gap:10px}
.lcard .hd .nm{flex:1;min-width:0}
.lcard .hd .nm b{display:block}
.lcard .hd .nm small{color:var(--muted);font-size:12.5px}
.ltask{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ltask.ok{border-color:var(--ok);background:var(--ok-soft)}
.ltask .tt{display:flex;align-items:flex-start;gap:8px}
.ltask .tt b{flex:1;min-width:0;font-size:15px;line-height:1.35}
.ltask .meta{font-size:12.5px;color:var(--muted);font-weight:700}
.ltask ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:14px}
.ltask li{display:flex;gap:6px}
.ltask li .b{flex:none;width:18px;font-weight:900;color:var(--muted)}
.ltask li.f{color:var(--ok);font-weight:700}
.ltask li.f .b{color:var(--ok)}
.ltask .acts{display:flex;gap:6px;flex-wrap:wrap}
.titem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:52px;font-weight:600}
.titem .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:900;color:transparent}
.titem.on{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.titem.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tcard.ok{border-color:var(--ok)}
.tcard h3{font-size:18px}
.dayhd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bellbox{display:flex;align-items:center;gap:12px;background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:12px 14px;font-size:14px}
.bellbox .ic{font-size:24px}
.bellbox .t{flex:1}

/* ===== TV vertical ===== */
body.tvmode{background:#141B4D;overflow:hidden}
body.tvmode.nocur{cursor:none}
.tv{position:fixed;inset:0;overflow:hidden;background:#141B4D}
.tv{transform-origin:center center}
.tvs{position:absolute;inset:0;overflow:hidden;font-family:'Nunito Sans',system-ui,sans-serif;color:#2A295C;line-height:1.2}
.tvs h1,.tvs h2,.tvs .disp{font-family:'Nunito',ui-rounded,system-ui,sans-serif}
.tvs.menu{background:#F5F6FB;display:flex;flex-direction:column}
.tvs.menu::before{content:"";position:absolute;width:70em;height:70em;border-radius:50%;background:#EB6619;opacity:.07;right:-28em;top:-30em}
.tvs.menu::after{content:"";position:absolute;width:60em;height:60em;border-radius:50%;background:#283897;opacity:.06;left:-30em;bottom:-26em}
.tvh{position:relative;z-index:1;padding:3.4em 4em 1.4em;display:flex;flex-direction:column;align-items:center;gap:1.2em;text-align:center}
.tvlogos{display:flex;align-items:center;justify-content:center;gap:3em}
.tvlogos .sx{height:6.4em;width:auto}
.tvlogos .nt{height:6em;width:auto}
.tvlogos .bar{width:.35em;height:6em;border-radius:1em;background:#C9CEE6}
.tvt h1{font-size:8.6em;font-weight:900;color:#283897;letter-spacing:-.02em;line-height:1}
.tvt h1 span{color:#EB6619}
.tvref{display:inline-flex;align-items:center;gap:.6em;margin-top:.55em;background:#283897;color:#fff;border-radius:99em;padding:.45em 1.4em;font-size:3.6em;font-weight:800;font-family:'Nunito',sans-serif}
.tvref i{font-style:normal;color:#FFD3BC}
.tvdate{font-size:2.9em;font-weight:700;color:#5B6285;margin-top:.5em}
.tvbody{position:relative;z-index:1;flex:1;min-height:0;padding:0 3.4em;display:grid;grid-template-columns:1fr 1fr;gap:2em;align-content:space-evenly}
.tc{background:#fff;border-radius:3em;padding:1.8em 1.6em 1.8em;box-shadow:0 .4em 1.8em rgba(40,56,151,.10);display:flex;flex-direction:column;gap:1.6em;min-width:0;position:relative;gap:1.2em}
.tc.full{grid-column:1/-1}
.tch{display:inline-flex;align-items:center;gap:.6em;align-self:flex-start;background:#283897;color:#fff;border-radius:99em;padding:.35em 1.1em .35em .4em;font-family:'Nunito',sans-serif;font-weight:900;font-size:3.1em;letter-spacing:.04em;text-transform:uppercase}
.tch .ic{width:1.6em;height:1.6em;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:.8em}
.tc.light .tch{background:#2B8A57}
.tci{display:flex;flex-wrap:wrap;justify-content:space-around;gap:1.4em .6em}
.ti{margin:0;display:flex;flex-direction:column;align-items:center;gap:.8em;width:21em;min-width:0}
.tc.half .ti{width:17em}
.ti .ph{width:17em;height:17em;border-radius:50%;overflow:hidden;background:#F1F3FA;display:grid;place-items:center;box-shadow:0 .3em 1em rgba(0,0,0,.12);border:.5em solid #fff;outline:.35em solid #F7D9C9}
.tc.half .ti .ph{width:15em;height:15em}
.ti .ph span{font-size:7em;line-height:1;display:grid;place-items:center}
.tc.half .ti .ph span{font-size:6em}
.ti .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ti figcaption{background:#FDEEE6;color:#2A295C;border-radius:1.2em;padding:.3em .8em;font-weight:800;font-size:2.5em;text-align:center;max-width:100%;line-height:1.15}
.tpills{display:flex;flex-wrap:wrap;gap:1.1em;justify-content:center}
.tp{background:#F1F3FA;border:.2em solid #E1E5F4;border-radius:99em;padding:.45em 1.2em;font-size:3.6em;font-weight:800;color:#2A295C;font-family:'Nunito',sans-serif}
.tslog{grid-column:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8em;padding:2em}
.tslog .s{font-family:'Nunito',sans-serif;font-weight:900;font-style:italic;font-size:4.4em;line-height:1.1;color:#EB6619}
.tslog .st{width:3em;height:3em;background:#DA2020;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.tvf{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:1.2em;padding:1.4em 4em 2.4em;font-family:'Nunito',sans-serif;font-weight:900;font-size:4.2em;color:#283897}
.tvf .st{width:.8em;height:.8em;background:#DA2020;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.tvf small{font-family:'Nunito Sans',sans-serif;font-size:.55em;font-weight:700;color:#5B6285}

.tvs.sb{background:radial-gradient(120% 70% at 50% 0%,#3A4DC4 0%,#283897 45%,#1B2263 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8em 6em;gap:5em}
.tvs.sb::before{content:"";position:absolute;width:80em;height:80em;border-radius:50%;background:#EB6619;opacity:.12;right:-40em;bottom:-36em}
.tvs.sb>*{position:relative;z-index:1}
.sblogos{display:flex;flex-direction:column;align-items:center;gap:4em}
.sblogos .sx{width:52em;height:auto}
.sblogos .nt{width:46em;height:auto}
.sblogos .pl{width:30em;height:.3em;border-radius:1em;background:rgba(255,255,255,.35)}
.sbclock{font-family:'Nunito',sans-serif;font-weight:900;font-size:13em;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sbmsg{font-size:4.6em;font-weight:800;line-height:1.25;max-width:20em;font-family:'Nunito',sans-serif}
.sbmsg b{color:#FFC7A8}
.sbhor{display:grid;gap:1.6em;width:100%;max-width:80em}
.sbh{display:flex;align-items:center;gap:2em;background:rgba(255,255,255,.1);border:.2em solid rgba(255,255,255,.18);border-radius:2.4em;padding:2em 3em;text-align:left}
.sbh.on{background:#fff;color:#283897;border-color:#fff}
.sbh .e{font-size:5em}
.sbh .n{flex:1;font-family:'Nunito',sans-serif;font-weight:900;font-size:4.2em}
.sbh .h{font-weight:800;font-size:3.6em;font-variant-numeric:tabular-nums;opacity:.95}
.tvs.media{background:#000}
.tvs.media .bg{position:absolute;inset:-5%;background-size:cover;background-position:center;filter:blur(3em) brightness(.55)}
.tvs.media img.fg,.tvs.media video.fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tvs.media.vid{background:#0f1440}
/* Animação de boas-vindas (feita em código: quase nada para baixar) */
.tvs.anim{background:#2B3797;color:#fff;--e:cubic-bezier(.65,0,.35,1)}
.tvs.anim .orb{position:absolute;border-radius:50%;pointer-events:none}
.tvs.anim .oa{width:100em;height:100em;left:-38em;top:-24em;background:radial-gradient(circle,rgba(255,255,255,.09) 0,rgba(255,255,255,0) 62%);animation:bvOA 12s ease-in-out var(--o) infinite}
.tvs.anim .ob{width:110em;height:110em;right:-48em;bottom:-33em;background:radial-gradient(circle,rgba(237,28,36,.16) 0,rgba(237,28,36,0) 60%);animation:bvOB 12s ease-in-out var(--o) infinite}
.tvs.anim .band{position:absolute;width:57em;height:2em;border-radius:1em;background:#ED1C24}
.tvs.anim .bl{left:-5.5em;top:10%;animation:bvBL 12s var(--e) var(--o) infinite both}
.tvs.anim .br{right:-5.5em;bottom:11%;animation:bvBR 12s var(--e) var(--o) infinite both}
.tvs.anim .bvw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13em;animation:bvBreath 6s ease-in-out infinite}
.tvs.anim .bvc{width:86em;height:26em;border-radius:3.4em;background:#fff;display:flex;align-items:center;justify-content:center;gap:4.8em;box-shadow:0 3.7em 8.3em rgba(0,0,0,.28);animation:bvCard 12s var(--e) var(--o) infinite both}
.tvs.anim .bvc .sx{height:12em;width:auto}
.tvs.anim .bvc .dv{width:.3em;height:13em;background:#d6d6e2;border-radius:.2em}
.tvs.anim .bvc .nt{height:5.8em;width:auto}
.tvs.anim .tx{display:flex;flex-direction:column;align-items:center;text-align:center;font-family:'Nunito',system-ui,sans-serif;font-weight:900;line-height:1.05}
.tvs.anim .l{animation:bvLine 12s var(--e) infinite both}
.tvs.anim .l1{font-size:10.6em;letter-spacing:.09em;animation-delay:calc(var(--o) + .9s)}
.tvs.anim .l2{font-size:11.6em;letter-spacing:.02em;animation-delay:calc(var(--o) + 1.2s)}
.tvs.anim .l3{font-size:10.6em;letter-spacing:.05em;animation-delay:calc(var(--o) + 1.5s)}
.tvs.anim .bar{width:31em;height:1.5em;border-radius:.75em;background:#ED1C24;margin-top:6em;animation:bvBar 12s var(--e) var(--o) infinite both}
@keyframes bvCard{0%,2%{opacity:0;transform:translateY(3.7em) scale(.94)}12%,86%{opacity:1;transform:none}95%,100%{opacity:0;transform:translateY(-2.2em) scale(.98)}}
@keyframes bvLine{0%{opacity:0;transform:translateY(.6em);filter:blur(.07em)}10%,80%{opacity:1;transform:none;filter:none}90%,100%{opacity:0;transform:translateY(-.35em);filter:blur(.05em)}}
@keyframes bvBar{0%,20%{transform:scaleX(0)}30%,80%{transform:scaleX(1)}88%,100%{transform:scaleX(0)}}
@keyframes bvBL{0%,1%{transform:translateX(-110%)}13%,87%{transform:none}99%,100%{transform:translateX(-110%)}}
@keyframes bvBR{0%,4%{transform:translateX(110%)}16%,84%{transform:none}96%,100%{transform:translateX(110%)}}
@keyframes bvBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes bvOA{0%,100%{transform:translate(0,0)}50%{transform:translate(5.5em,8.3em)}}
@keyframes bvOB{0%,100%{transform:translate(0,0)}50%{transform:translate(-7.4em,-5.5em)}}
.tvs.anim.frz .bl{top:3.2%}
.tvs.anim.frz .br{bottom:3.2%}
.tvs.anim .fz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8em;text-align:center;animation:bvBreath 6s ease-in-out infinite}
.tvs.anim .fz .lg{position:absolute;top:7.5%;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:3.6em;animation:bvCard 12s var(--e) var(--o) infinite both}
.tvs.anim .fz .lg .sx{height:7em;width:auto}
.tvs.anim .fz .lg .pl{width:.25em;height:6em;background:rgba(255,255,255,.45);border-radius:.2em}
.tvs.anim .fz .lg .nt{height:3.5em;width:auto}

function equipeMap(d){const m={};(d?d.equipe:[]).forEach(c=>m[c.id]=c);return m}
function quizPontos(d){
  const out={},em=equipeMap(d);
  d.quizzes.forEach(q=>ORDEM_G.forEach(g=>{
    const rs=d.respostas.filter(r=>r.quizId===q.id&&em[r.colabId]&&em[r.colabId].grupo===g)
      .sort((a,b)=>b.acertos-a.acertos||String(a.em).localeCompare(String(b.em)));
    rs.forEach((r,i)=>{const bonus=r.acertos>0&&i<3?QUIZ_BONUS[i]:0;out[r.id]={pts:QUIZ_PART+bonus,pos:i+1,bonus}});
  }));
  return out;
}
/* Período: 'AAAA' (ano acumulado) ou 'AAAA-MM' (mês) */
const anoKey=()=>String(new Date().getFullYear());
const noPeriodo=(p,mes)=>String(p).length===4?String(mes).slice(0,4)===p:mes===p;
const perLabel=p=>String(p).length===4?'ano de '+p:mesLabel(p);
function anos(d){return [...new Set(meses(d).map(m=>m.slice(0,4)))].sort().reverse()}
function placar(d,mes){
  const t={},qp=quizPontos(d);
  const get=id=>t[id]||(t[id]={aval:0,quiz:0,dias:0,nq:0});
  d.avaliacoes.forEach(a=>{if(noPeriodo(mes,a.mes)){const o=get(a.colabId);o.aval+=Number(a.pontos)||0;o.dias++}});
  d.respostas.forEach(r=>{if(noPeriodo(mes,r.mes)&&qp[r.id]){const o=get(r.colabId);o.quiz+=qp[r.id].pts;o.nq++}});
  Object.values(t).forEach(o=>o.total=o.aval+o.quiz);
  return t;
}
function ranking(d,mes,g){
  if(!d)return[];
  const t=placar(d,mes);
  const list=d.equipe.filter(c=>c.grupo===g&&(c.ativo||t[c.id])).map(c=>Object.assign({c},t[c.id]||{aval:0,quiz:0,dias:0,nq:0,total:0}));
  list.sort((a,b)=>b.total-a.total||b.aval-a.aval||String(a.c.nome).localeCompare(String(b.c.nome),'pt-BR'));
  let pos=0,prev=null;list.forEach((x,i)=>{if(prev===null||x.total!==prev){pos=i+1;prev=x.total}x.pos=pos});
  return list;
}
function premioDe(d,mes,g){return (d&&(d.premios.find(p=>p.mes===mes&&p.grupo===g)||d.premios.find(p=>p.mes===mes&&!p.grupo)))||{p1:'',p2:'',p3:''}}
function meses(d){const s=new Set([mesKey()]);if(d){d.avaliacoes.forEach(a=>a.mes&&s.add(a.mes));d.respostas.forEach(r=>r.mes&&s.add(r.mes));d.quizzes.forEach(q=>q.mes&&s.add(q.mes));d.premios.forEach(p=>p.mes&&p.mes.length===7&&s.add(p.mes))}return[...s].sort().reverse()}

const PEND={};let pendT=null,salvando=false;
function setAval(c,dia,itens){
  const d=S.adm,id=c.id+'_'+dia;
  d.avaliacoes=d.avaliacoes.filter(a=>a.id!==id);
  if(itens!==null)d.avaliacoes.push({id,colabId:c.id,data:dia,mes:dia.slice(0,7),itens,pontos:ptsItens(c,itens)});
  PEND[id]={colabId:c.id,data:dia,itens,pontos:itens===null?0:ptsItens(c,itens)};
  clearTimeout(pendT);pendT=setTimeout(flush,900);
  render();
}
async function flush(){
  if(salvando){pendT=setTimeout(flush,500);return}
  const ids=Object.keys(PEND);if(!ids.length)return;
  const lote=ids.map(k=>PEND[k]);ids.forEach(k=>delete PEND[k]);
  salvando=true;
  try{await call('salvarAvaliacoes',adminPin,lote)}
  catch(e){lote.forEach(a=>{const k=a.colabId+'_'+a.data;if(!PEND[k])PEND[k]=a});toast('Não salvou: '+msg(e)+' Tentando de novo…');pendT=setTimeout(flush,4000)}
  salvando=false;render();
}

/* ---------- Confete ---------- */
function confete(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.id='confete';document.body.appendChild(c);
  const W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const cores=['#283897','#DA2020','#F2B632','#3FA7E0','#2BB673'];
  const ps=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*60,y:H*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-5,r:Math.random()*6+5,c:cores[Math.random()*cores.length|0],a:Math.random()*6,va:(Math.random()-.5)*.35}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t-t0<2300)requestAnimationFrame(f);else c.remove()})(t0);
}

/* Atualização forçada: compara a versão do app com a publicada */
let esperandoAtt=false;
function aplicarAtualizacao(){
  const ocupado=Object.keys(PEND).length||S.busy||S.play||$('#modal').innerHTML;
  if(ocupado){esperandoAtt=true;setTimeout(aplicarAtualizacao,3000);return}
  toast('Nova versão! Atualizando o app…');
  const limpar=('caches' in window)?caches.keys().then(ks=>Promise.all(ks.filter(k=>!k.startsWith('tv-')).map(k=>caches.delete(k)))).catch(()=>{}):Promise.resolve();
  Promise.race([limpar,new Promise(ok=>setTimeout(ok,1500))]).then(()=>setTimeout(()=>location.reload(),300));
}
async function checarVersao(){
  if(esperandoAtt||DEMO)return;
  try{const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.json()).v;if(v&&v!==APP_VERSION)aplicarAtualizacao()}catch(e){}
}

function midiaInfo(s){

  if(s.startsWith('anim:frase:')){const [t,sb]=s.slice(11).split('|');let a='',b='';try{a=decodeURIComponent(t||'');b=decodeURIComponent(sb||'')}catch(e){}return {tipo:'anim',nome:'frase',t:a,s:b,d:12,src:s}}

  const v=s.match(/^video:(\d+):(.+)$/);

/* Vídeos: a TV baixa cada um UMA vez, guarda no aparelho e só mostra depois de pronto (sem travar com internet fraca) */
const TVV={prontos:{},falhou:{},rodando:false};
async function tvVideosPreparar(){
  if(TVV.rodando)return;TVV.rodando=true;
  try{
    const urls=((TV.dados||{}).midias||[]).map(midiaInfo).filter(m=>m.tipo==='video').map(m=>m.url);
    let c=null;try{c=await caches.open('tv-videos')}catch(e){}
    if(c){try{for(const r of await c.keys())if(!urls.includes(r.url))await c.delete(r)}catch(e){}}
    for(const u of Object.keys(TVV.prontos))if(!urls.includes(u)){try{URL.revokeObjectURL(TVV.prontos[u])}catch(e){}delete TVV.prontos[u]}
    for(const u of urls){
      if(TVV.prontos[u])continue;
      try{
        let r=c?await c.match(u):null;
        if(!r){
          if(TVV.falhou[u]&&Date.now()-TVV.falhou[u]<3*60000)continue;
          const res=await fetch(u);
          if(!res.ok)throw new Error('baixar');
          const blob=await res.blob();
          if(c){try{await c.put(u,new Response(blob,{headers:{'Content-Type':blob.type||'video/mp4'}}))}catch(e){}}
          TVV.prontos[u]=URL.createObjectURL(blob);
        }else TVV.prontos[u]=URL.createObjectURL(await r.blob());
        delete TVV.falhou[u];
      }catch(e){TVV.falhou[u]=Date.now()}
    }
  }finally{TVV.rodando=false}
}

    let lo=.45,hi=2.2;

/* Envio de vídeo: confere tamanho e duração, pede um link de envio (com o PIN) e manda direto para o armazenamento */
function lerVideo(f){return new Promise(res=>{const v=document.createElement('video');v.preload='metadata';v.muted=true;const u=URL.createObjectURL(f);
  const fim=r=>{try{URL.revokeObjectURL(u)}catch(e){}res(r)};
  v.onloadedmetadata=()=>fim({d:v.duration,w:v.videoWidth,h:v.videoHeight});v.onerror=()=>fim(null);setTimeout(()=>fim(null),15000);v.src=u})}
function enviarArquivo(url,f,aoProgresso){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('PUT',url);
  x.setRequestHeader('apikey',SUPA_KEY);x.setRequestHeader('Content-Type',f.type);x.setRequestHeader('x-upsert','false');
  x.upload.onprogress=e=>{if(e.lengthComputable)aoProgresso(Math.round(e.loaded/e.total*100))};
  x.onload=()=>x.status>=200&&x.status<300?res():rej(new Error('falha no envio ('+x.status+'). Tente de novo.'));
  x.onerror=()=>rej(new Error('a internet caiu durante o envio. Tente de novo.'));x.send(f)})}
async function funcaoMidia(body){
  let r;try{r=await fetch(SUPA_URL.replace(/\/$/,'')+'/functions/v1/subir-midia',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPA_KEY},body:JSON.stringify({pin:adminPin,...body})})}
  catch(e){throw new Error('sem conexão com a internet.')}
  const j=await r.json().catch(()=>null);if(!j)throw new Error('o servidor não respondeu.');if(j.erro)throw new Error(j.erro);return j;
}
async function enviarVideo(f){
  if(!/^video\/(mp4|webm)$/.test(f.type))throw new Error('use um vídeo MP4 ou WebM.');
  if(f.size>20*1024*1024)throw new Error(`o vídeo tem ${(f.size/1048576).toFixed(1).replace('.',',')} MB. O máximo é 20 MB.`);
  const info=await lerVideo(f);
  if(!info||!isFinite(info.d)||!info.d)throw new Error('não consegui ler este vídeo. Exporte em MP4 (H.264).');
  if(info.d>60.5)throw new Error('o vídeo tem mais de 60 segundos. Corte para até 60.');
  const seg=Math.max(1,Math.round(info.d));
  let link;
  if(DEMO){link=URL.createObjectURL(f)}
  else{
    toast('Preparando envio…');
    const r=await funcaoMidia({acao:'link',tipo:f.type,tamanho:f.size});
    await enviarArquivo(SUPA_URL.replace(/\/$/,'')+'/storage/v1/object/upload/sign/tv-midias/'+r.path+'?token='+encodeURIComponent(r.token),f,p=>toast('Enviando vídeo… '+p+'% (não feche esta tela)'));
    link=r.publico;
  }
  await call('salvarMidia',adminPin,'video:'+seg+':'+link);
  await carregarCardapio();
  toast(info.w>info.h?'Vídeo adicionado. Ele está deitado: na TV aparece com faixas em cima e embaixo.':'Vídeo adicionado ao stand-by');
}

const TPEND={};
function minhasTarefas(dia){return (S.pub&&S.pub.minhasTarefas||[]).filter(t=>!dia||t.data===dia)}
function tarefasPendentesHoje(){return minhasTarefas(isoDia()).some(t=>{const[a,b]=progTarefa(t);return a<b})}
function pushSuportado(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&location.protocol==='https:'}
function b64u8(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,ch=>ch.charCodeAt(0))}
async function ligarAvisos(silencioso){
  if(!pushSuportado()){if(!silencioso)toast(IOS&&!STANDALONE?'No iPhone, instale o app na tela inicial primeiro (Compartilhar → Adicionar à Tela de Início).':'Este celular não aceita avisos pelo navegador.');return false}
  try{
    if(Notification.permission!=='granted'){if(silencioso)return false;const p=await Notification.requestPermission();if(p!=='granted'){toast('Avisos bloqueados. Libere nas configurações do navegador.');render();return false}}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(VAPID_PUB)});
    await call('salvarPush',S.me.pin,sub.toJSON());LS.set('qsn_push','1');
    if(!silencioso){toast('Notificações ativadas! Você vai receber os avisos do quiz no celular.');render()}
    return true;
  }catch(e){if(!silencioso)toast('Não foi possível ligar os avisos: '+msg(e));return false}
}
function avisosLigados(){return pushSuportado()&&Notification.permission==='granted'&&LS.get('qsn_push')==='1'}

function marcarItem(id,ix){
  const t=minhasTarefas().find(x=>x.id===id);if(!t)return;
  const its=t.itens.length?t.itens:[t.titulo],i=its[+ix];
  if(!t.itens.length){t.itens=[t.titulo]}
  const fs=new Set(t.feitos);fs.has(i)?fs.delete(i):fs.add(i);t.feitos=[...fs];
  t.feitoEm=t.feitos.length>=t.itens.length?new Date().toISOString():null;
  render();
  if(t.feitoEm)toast('Tarefa concluída!');
  clearTimeout(TPEND[id]);TPEND[id]=setTimeout(async()=>{delete TPEND[id];try{await call('marcarTarefa',S.me.pin,id,t.feitos)}catch(e){toast('Não salvou: '+msg(e))}},600);
}

}

const hhmmDe=iso=>{const d=new Date(iso);return pad2(d.getHours())+':'+pad2(d.getMinutes())};
function quando(iso){
  if(!iso)return 'nunca';const d=new Date(iso),s=(Date.now()-d)/1000;
  if(s<90)return 'agora';if(s<3600)return 'há '+Math.round(s/60)+' min';
  if(isoDia(d)===isoDia())return 'hoje, '+hhmmDe(iso);
  if(isoDia(d)===somaDia(isoDia(),-1))return 'ontem, '+hhmmDe(iso);
  return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+', '+hhmmDe(iso);
}

    q.perguntas.forEach((p,i)=>{
      const resp=rs.filter(r=>r.escolhas[i]!=null);if(!resp.length)return;
      const cont=[0,0,0,0];const errou=[];let ok=0;const g={};
      resp.forEach(r=>{const e=r.escolhas[i];if(e>=0&&e<4)cont[e]++;const c=em[r.colabId],gk=c?c.grupo:'';(g[gk]||(g[gk]={n:0,ok:0})).n++;(porG[gk]||(porG[gk]={n:0,ok:0})).n++;
        if(e===p.c){ok++;g[gk].ok++;porG[gk].ok++}else errou.push(c?c.nome:'—')});
      tot+=resp.length;ac+=ok;
      let maisErr=-1;cont.forEach((n,j)=>{if(j!==p.c&&n>0&&(maisErr<0||n>cont[maisErr]))maisErr=j});
      linhas.push({q,i,p,n:resp.length,ok,pct:Math.round(ok/resp.length*100),cont,maisErr,errou,g});
    })});
  linhas.sort((a,b)=>a.pct-b.pct||b.n-a.n);
  return {qs,linhas,tot,ac,porG,per};
}
function aQuizAnalise(){
  if(!S.qa)return S.qaErr?`<div class="notice">Não foi possível carregar a análise. ${esc(S.qaErr)} <button class="link" data-act="qaReload">Tentar de novo</button></div>`:carregando('Calculando acertos e erros…');
  const A_=analiseQuiz(),{linhas,tot,ac,porG}=A_,pctG=tot?Math.round(ac/tot*100):0;
  const fracos=linhas.filter(l=>l.pct<70);
  const barra=(p)=>`<div class="prog" style="height:10px"><i style="width:${p}%;background:${p>=70?'var(--ok)':p>=40?'#E0A21B':'var(--bad)'}"></i></div>`;
  return `<div class="toolbar"><div class="grp"><h2 style="font-size:22px">Onde a equipe mais erra</h2>${S.qaPer==='ano'?anoSelect('selAnoQa',S.mesQuiz.slice(0,4)):mesSelect('selMesQz',S.mesQuiz)}</div>

    <div class="stats"><div class="stat"><b class="num">${pctG}%</b><span>de acerto geral</span></div><div class="stat"><b class="num">${tot}</b><span>respostas analisadas</span></div><div class="stat"><b class="num">${fracos.length}</b><span>perguntas com menos de 70%</span></div></div>
    ${Object.keys(porG).length?`<section class="panel"><div class="sec-h"><h2>Acerto por grupo</h2></div><div class="stack" style="gap:10px">${ORDEM_G.filter(g=>porG[g]).map(g=>{const p=Math.round(porG[g].ok/porG[g].n*100);return `<div><div class="qprog" style="margin-bottom:4px"><b>${esc(GRUPOS[g].nome)}</b><span class="num muted">${p}%</span></div>${barra(p)}</div>`}).join('')}</div></section>`:''}
    ${linhas.length?`<section><div class="sec-h"><h2>Perguntas, da mais errada para a mais certa</h2></div><div class="list">${linhas.map((l,ix)=>`<div class="panel stack" style="gap:8px">
        <div class="qprog" style="margin:0"><span class="eyebrow">${esc(l.q.titulo)} · pergunta ${l.i+1}</span><span class="chip ${l.pct>=70?'ok':l.pct>=40?'gold':'bad'} num">${l.pct}% acertou</span></div>
        <b style="font-size:16px">${esc(l.p.p)}</b>${barra(l.pct)}
        <div style="font-size:14px;line-height:1.5"><span style="color:var(--ok);font-weight:700">${ic('check')} Certa: ${esc(l.p.ops[l.p.c])}</span>${l.maisErr>=0?`<br><span style="color:var(--bad);font-weight:700">${ic('x')} Erro mais comum: ${esc(l.p.ops[l.maisErr])} (${l.cont[l.maisErr]} pessoa${l.cont[l.maisErr]>1?'s':''})</span>`:''}</div>
        <div class="muted num" style="font-size:13px">${l.ok} de ${l.n} acertaram${Object.keys(l.g).length>1?' · '+ORDEM_G.filter(g=>l.g[g]).map(g=>esc(GRUPOS[g].nome)+' '+Math.round(l.g[g].ok/l.g[g].n*100)+'%').join(' · '):''}</div>
        ${l.errou.length?`<details><summary class="link" style="padding:0;cursor:pointer;font-size:14px">Quem errou (${l.errou.length})</summary><p style="margin:6px 0 0;font-size:14px">${l.errou.map(esc).join(', ')}</p></details>`:''}
      </div>`).join('')}</div></section>`
    :`<div class="empty">Ainda não há respostas de quiz ${S.qaPer==='ano'?'neste ano':'neste mês'}.</div>`}
    <p class="muted" style="font-size:13px;margin:0">Use as perguntas no vermelho como tema do próximo treinamento. Depois do treinamento, repita perguntas parecidas num quiz novo para ver se melhorou.</p>`;
}
function resumoTreinamento(){
  const {linhas,per}=analiseQuiz(),f=linhas.filter(l=>l.pct<70).slice(0,8);
  return `*Pontos para treinamento* (${perLabel(per)})\n\n`+f.map((l,i)=>`${i+1}. ${l.p.p}\n   Acerto: ${l.pct}% (${l.ok} de ${l.n})\n   Resposta certa: ${l.p.ops[l.p.c]}${l.maisErr>=0?`\n   Erro mais comum: ${l.p.ops[l.maisErr]}`:''}${l.p.e?`\n   Explicação: ${l.p.e}`:''}`).join('\n\n');
}

let QSKEW=0;
const agoraMs=()=>Date.now()+QSKEW;
function syncRelogio(d){try{if(d&&d.agora){const s=Date.parse(d.agora);if(s&&Math.abs(s-Date.now())>30000)QSKEW=s-Date.now();else QSKEW=0}}catch(e){}}
const BEL=3*3600e3; /* Belém: UTC-3, sem horário de verão */
function belParts(ms){const d=new Date(ms-BEL);return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),w:d.getUTCDay(),h:d.getUTCHours(),mi:d.getUTCMinutes()}}
function belMs(y,m,d,h,mi){return Date.UTC(y,m-1,d,h||0,mi||0)+BEL}
function fimMes(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
function janela(mes,q){const[y,m]=String(mes).split('-').map(Number);const f=fimMes(y,m);
  return +q===2?{mes,q:2,ini:16,fim:f,abre:belMs(y,m,16),fecha:belMs(y,m,f,23,50)}:{mes,q:1,ini:1,fim:15,abre:belMs(y,m,1),fecha:belMs(y,m,15,23,50)}}
function cicloAgora(){const p=belParts(agoraMs());return janela(p.y+'-'+pad2(p.m),p.d<=15?1:2)}
function cicloSeguinte(c){if(c.q===1)return janela(c.mes,2);const[y,m]=c.mes.split('-').map(Number);return janela(m===12?(y+1)+'-01':y+'-'+pad2(m+1),1)}
const qAbre=q=>q.abre?Date.parse(q.abre):janela(q.mes,q.quinzena||1).abre;
const qFecha=q=>q.fecha?Date.parse(q.fecha):janela(q.mes,q.quinzena||1).fecha;
const qNPerg=q=>q.nPerg||(q.perguntas||[]).length;
const qzLabel=q=>(+q===2?'2ª':'1ª')+' quinzena';
function quizzesAbertos(){const t=agoraMs();return S.pub?S.pub.quizzes.filter(q=>q.ativo&&t>=qAbre(q)&&t<qFecha(q)):[]}
function proximaAbertura(){
  /* Próximo quiz agendado (se a gestão já criou); senão, o início da próxima quinzena */
  const t=agoraMs(),ag=S.pub?S.pub.quizzes.filter(q=>q.ativo&&qAbre(q)>t).sort((a,b)=>qAbre(a)-qAbre(b))[0]:null;
  if(ag)return {ms:qAbre(ag),quiz:ag,c:janela(ag.mes,ag.quinzena||1)};
  const c=cicloAgora(),n=t<c.abre?c:cicloSeguinte(c);return {ms:n.abre,quiz:null,c:n};
}
const DSEM=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
function dataBel(ms,comSemana){const p=belParts(ms);return (comSemana?DSEM[p.w]+', ':'')+pad2(p.d)+'/'+pad2(p.m)}
function prazoTxt(q){return dataBel(qFecha(q)-60000,true)+' às 23h49'}

/* ---------- Contagem regressiva (atualiza sozinha a cada segundo) ---------- */
function cdPartes(alvo){let s=Math.max(0,Math.floor((alvo-agoraMs())/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;return {d,h,m:Math.floor(s/60),s:s%60}}
function cdInner(alvo,modo){const p=cdPartes(alvo);
  if(modo==='c')return p.d?`${p.d}d ${p.h}h ${pad2(p.m)}min`:p.h?`${p.h}h ${pad2(p.m)}min`:`${p.m}min ${pad2(p.s)}s`;
  return [[p.d,p.d===1?'dia':'dias'],[p.h,p.h===1?'hora':'horas'],[p.m,'min'],[p.s,'seg']].map(([v,l])=>`<span class="cdu"><b class="num">${pad2(v)}</b><small>${l}</small></span>`).join('<i class="cdsep">:</i>');}
function cdHtml(alvo,modo){return modo==='c'?`<b class="num" data-cd="${alvo}" data-cdm="c">${cdInner(alvo,'c')}</b>`:`<div class="cd" data-cd="${alvo}" role="timer" aria-live="off">${cdInner(alvo)}</div>`}
setInterval(()=>{
  let virou=false;
  document.querySelectorAll('[data-cd]').forEach(e=>{const a=+e.dataset.cd;e.innerHTML=cdInner(a,e.dataset.cdm);if(a<=agoraMs()&&!e.dataset.fim){e.dataset.fim=1;virou=true}});
  if(virou&&!S.play&&!$('#modal').innerHTML)setTimeout(()=>{render();if(S.me)carregar(true);else if(S.view==='admin')carregarGestao()},1200);
},1000);

/* ---------- Ilustração do ciclo (calendário das duas quinzenas) ---------- */
function cicloIlustrado(){

  const qs=S.pub?S.pub.quizzes.filter(q=>q.ativo&&q.mes===c.mes):[];
  const linha=(qn)=>{const j=janela(c.mes,qn),tem=qs.some(q=>(q.quinzena||1)===qn),cel=[];
    for(let d=j.ini;d<=j.fim;d++){const off=d-j.ini,cls=['dc'];
      if(d<p.d||(qn===1&&c.q===2))cls.push('pass');if(d===p.d&&qn===c.q)cls.push('hoje');

    else if(!j.enviados)toast('Quem falta ainda não ativou as notificações. Avise pelo WhatsApp.');
    else toast(`Lembrete enviado para ${j.enviados} de ${j.pessoas} pessoa${j.pessoas>1?'s':''}.${j.semCelular?` ${j.semCelular} sem notificações: avise pelo WhatsApp.`:''}`);
  }catch(e){toast(msg(e))}
  busyBtn(b,false,ic('megaphone')+' Avisar quem falta agora');
}
Object.assign(RPC,{salvarLembreteQuiz:['salvar_lembrete_quiz',['p_pin','p_dias']]});
Object.assign(A,{
  qAvisos:async()=>{const ok=await ligarAvisos(false);render();return ok},
  qAvisosModal:async()=>{closeModal();await ligarAvisos(false);render()},
  lembDias:async d=>{try{await acao('salvarLembreteQuiz',+d.k);toast(`Lembrete a cada ${d.k} dias`)}catch(e){toast(msg(e))}},
  avisarQuiz:(d,b)=>{confirmModal('Avisar quem ainda não respondeu?','Quem ativou as notificações recebe agora um lembrete no celular. Quem já respondeu não recebe nada.','Enviar agora',async()=>{await avisarQuizAgora(b)})},
});
addEventListener('hashchange',()=>{if(S.me&&S.view==='home'&&(location.hash==='#quiz'||location.hash==='#tarefas')){S.play=null;S.ctab=location.hash.slice(1);render()}});

let TV_MODE=false;try{TV_MODE=new URLSearchParams(location.search).has('tv')}catch(e){}
if(TV_MODE){S.view='tv';iniciarTv();tvPintar(true)}
else{
if(S.me&&location.hash==='#tarefas')S.ctab='tarefas';
if(S.me&&location.hash==='#quiz')S.ctab='quiz';
if(S.me&&S.view==='home')registrar('abriu');
render();
if(S.view==='admin')carregarGestao();
carregar();
try{if(new URLSearchParams(location.search).has('gestao')&&S.view!=='admin'){S.view='adminLogin';S.pin='';S.pinErr='';render()}}catch(e){}
}
