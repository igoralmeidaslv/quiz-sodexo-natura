<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#283897">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiz Natura">
<meta name="robots" content="noindex, nofollow">
<title>Quiz Sodexo Natura</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Sodexo identity: logo blue + red star, white brand bar. Layout: mobile-first single column for the team (keypad → placar → quiz); wide multi-column panel for management. */
:root{
  --bg:#F2F4FA;--surface:#FFFFFF;--sunk:#E7EAF4;--ink:#2A295C;--muted:#5B6285;--line:#D9DDEC;
  --brand:#283897;--brand-ink:#FFFFFF;--accent:#DA2020;--accent-soft:#E4E8F8;--accent-ink:#1E2B7A;
  --ok:#17845A;--ok-soft:#DDF2E8;--bad:#C0362C;--bad-soft:#FBE3E0;--bar:#FFFFFF;--bar-ink:#283897;
  --display:'Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1130;--surface:#161C45;--sunk:#10153A;--ink:#E6E9F8;--muted:#9AA2CC;--line:#262E63;
  --brand:#3A4DC4;--brand-ink:#FFFFFF;--accent:#FF5A4E;--accent-soft:#1F2A6B;--accent-ink:#D3DAFF;
  --ok:#4CC38F;--ok-soft:#113426;--bad:#FF7A6E;--bad-soft:#3C1714;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1130;--surface:#161C45;--sunk:#10153A;--ink:#E6E9F8;--muted:#9AA2CC;--line:#262E63;
  --brand:#3A4DC4;--brand-ink:#FFFFFF;--accent:#FF5A4E;--accent-soft:#1F2A6B;--accent-ink:#D3DAFF;
  --ok:#4CC38F;--ok-soft:#113426;--bad:#FF7A6E;--bad-soft:#3C1714;color-scheme:dark}

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1120px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--brand);box-shadow:0 1px 0 var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:900;font-size:19px;flex:1;min-width:0;color:var(--bar-ink)}
.brand img{height:30px;width:auto;flex:none}
.brand .sep{width:1px;height:30px;background:#C9CEE6;flex:none}
.brand .q{line-height:1.05;letter-spacing:-.01em;min-width:0}
.brand .q span{color:#DA2020}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5B6285}
.ghost{background:transparent;border:1.5px solid #283897;color:#283897;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600}

main{padding-block:20px 48px}
.stack{display:flex;flex-direction:column;gap:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-size:19px}
.eyebrow{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--brand);color:var(--brand-ink);min-height:48px}
.btn.alt{background:var(--sunk);color:var(--ink)}
.btn.warn{background:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--brand);font-weight:600;text-decoration:underline;padding:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .link{color:var(--accent)}}
:root[data-theme="dark"] .link{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}

/* Login */
.login{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:28px}
.login h1{font-size:28px}
.dots{display:flex;gap:14px;margin:18px 0 6px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand);transition:background .12s}
.dot.on{background:var(--brand)}
.err{color:var(--bad);font-weight:600;min-height:24px;margin:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:320px;margin:10px 0 18px}
.pad button{height:68px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:600;font-size:28px;box-shadow:0 1px 0 var(--line)}
.pad button:active{background:var(--sunk);transform:translateY(1px)}
.pad .blank{visibility:hidden}
.pad .bk{font-size:20px;font-family:var(--body);font-weight:600;color:var(--muted)}

/* Avatars */
.av{border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;overflow:hidden;background:var(--brand)}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* Score hero */
.score{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:end;position:relative;overflow:hidden}
.score::after{content:"";position:absolute;right:-36px;top:-36px;width:150px;height:150px;border-radius:50%;background:#FFFFFF;opacity:.08}
.score::before{content:"";position:absolute;right:18px;top:16px;width:14px;height:14px;background:var(--accent);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.score .lbl{font-size:13px;font-weight:600;opacity:.85;grid-column:1/-1}
.score .pts{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.score .pts span{font-size:20px;font-weight:600;margin-left:4px;opacity:.85}
.score .pos{text-align:right;position:relative;z-index:1;padding-top:14px}
.score .pos b{display:block;font-family:var(--display);font-size:30px;line-height:1}
.score .meta{grid-column:1/-1;font-size:14px;opacity:.9;margin-top:6px}

/* Quiz list */
.qitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:64px}
.qitem .t{flex:1;min-width:0;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.gold{background:var(--accent-soft);color:var(--accent-ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.off{background:var(--sunk);color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.done{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px}
.done:last-child{border-bottom:0}
.done .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:22px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* Ranking rows */
.rk{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px}
.rk:nth-child(odd){background:var(--sunk)}
.rk.me{background:var(--accent-soft);color:var(--accent-ink)}
.rk .p{width:28px;font-family:var(--display);font-weight:800;font-size:18px;text-align:center}
.rk .n{flex:1;min-width:0}
.rk .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .n small{color:var(--muted);font-size:13px}
.rk.me .n small{color:inherit;opacity:.8}
.rk .v{font-family:var(--display);font-weight:800;font-size:18px}
.rk .v small{font-family:var(--body);font-weight:600;font-size:12px;opacity:.7}

/* Quiz screen */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qtext{font-size:24px;margin:14px 0 18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:17px;min-height:60px}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.opt.sel{border-color:var(--brand)}
.opt.sel .l{background:var(--brand);color:var(--brand-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:#fff}
.verdict{border-radius:14px;padding:14px 16px;font-weight:700;font-size:17px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.sticky-cta{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* Admin */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:14px 12px 11px;font-weight:700;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=number],input[type=month],input[type=tel],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
select{width:auto}
textarea{min-height:84px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end}
.pd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pd.p1{background:var(--accent-soft);border-color:var(--accent);padding-block:20px}
.pd .medal{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pd.p1 .medal{color:var(--accent-ink)}
.pd .nm{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .pt{font-family:var(--display);font-weight:800;font-size:22px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.card .qq{font-weight:700;font-size:16px}
.card ol{margin:0;padding-left:20px;font-size:14px;color:var(--muted)}
.card ol li.c{color:var(--ok);font-weight:700}
.pinv{font-family:var(--display);font-weight:800;letter-spacing:.2em}
.notice{background:var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:14px 16px;font-size:15px}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(5,20,16,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:20px;padding:24px}}
.sheet h2{font-size:22px;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label,.fld .lb{font-weight:600;font-size:14px}
.fld .hint{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.optrow{display:flex;align-items:center;gap:10px}
.optrow input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.photo{display:flex;align-items:center;gap:14px}
.ferr{color:var(--bad);font-weight:600;min-height:22px;margin:0 0 8px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--brand)}

.foot{background:#2A295C;color:#E4E6F4;margin-top:8px}
.foot .wrap{padding-block:28px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.foot.wide .wrap{max-width:1120px}
.foot .fl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.foot img{height:26px;width:auto}
.foot .tag{font-family:var(--display);font-weight:800;font-size:15px;color:#fff}
.foot .disc{border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.55;max-width:68ch}
.foot .disc b{color:#fff}
.foot .small{font-size:12px;color:#A9AED3}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}

@media (max-width:420px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:22px}.qtext{font-size:21px}.score .pts{font-size:48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}html{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
.demo{background:#FFF1CC;color:#5A4200;font-size:13px;font-weight:700;text-align:center;padding:7px 16px}
#confete{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px 0;color:var(--muted);font-weight:600}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pad.busy{opacity:.5;pointer-events:none}
a.btn{text-decoration:none}
.pd .medal-e{font-size:30px;line-height:1}
.pd .prz{font-size:12px;color:var(--muted);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}

/* Navegação inferior (equipe) */
body.has-nav main{padding-bottom:110px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.bnav .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:560px}
.bnav button{background:none;border:0;border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.bnav button .ic{font-size:21px;line-height:1.1}
.bnav button.on{color:var(--brand);background:var(--accent-soft)}
.bnav .dotn{position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--accent)}

/* Checklist */
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:58px}
.chk .bx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:900;color:transparent}
.chk.on{border-color:var(--ok);background:var(--ok-soft)}
.chk.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.chk .t{flex:1;min-width:0}
.chk .t b{display:block;font-size:15px}
.chk .t small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.prog{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.cta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);color:var(--accent-ink);border:1.5px solid var(--brand);border-radius:16px;padding:14px 16px;font-weight:700}
.cta .ic{font-size:26px}
.miss{color:var(--bad);font-size:14px;font-weight:600}

/* Avaliação (gestão) */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .dt{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:18px;text-transform:capitalize}
.datebar .nb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:800}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sunk);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:800;font-size:13px;color:var(--muted);line-height:1.2}
.seg button small{display:block;font-weight:700;font-size:11px;opacity:.85}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.pcard.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pcard .hd{display:flex;align-items:center;gap:10px}
.pcard .hd .nm{flex:1;min-width:0}
.pcard .hd .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .hd .nm small{color:var(--muted);font-size:12.5px}
.pcard .sc{font-family:var(--display);font-weight:900;font-size:20px;text-align:right;line-height:1}
.pcard .sc small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted)}
.crits{display:flex;flex-wrap:wrap;gap:8px}
.crit{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:40px}
.crit .v{font-size:12px;opacity:.8}
.crit.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pcard .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.saved{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:auto}
.saved.ok{color:var(--ok)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}
.grid3>section{min-width:0}
.qblock{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);margin-bottom:12px}
.qblock .qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:800}
.qprog{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.corr{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.corr:last-child{border-bottom:0}
.corr .ic{flex:none;font-weight:900}
.prizes{display:grid;gap:8px}
.prize{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.prize .m{font-size:22px}
.daylist .done .t{white-space:normal}
@media (max-width:420px){.seg button{font-size:12px}.crit{font-size:13px;padding:7px 10px}}

const deIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const mesLabel=k=>{const[y,m]=String(k).split('-');return (MESES[+m-1]||k)+' de '+y};

const util=s=>{const w=deIso(s).getDay();return w>=1&&w<=5};
function passoUtil(s,dir){let d=deIso(s);do{d.setDate(d.getDate()+dir)}while(d.getDay()===0||d.getDay()===6);return isoDia(d)}

  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||'O servidor não respondeu. Tente de novo em instantes.');
  if(j&&j.erro)throw new Error(j.erro);
  return j;
}

function equipeMap(d){const m={};(d?d.equipe:[]).forEach(c=>m[c.id]=c);return m}
function quizPontos(d){
  const out={},em=equipeMap(d);
  d.quizzes.forEach(q=>ORDEM_G.forEach(g=>{
    const rs=d.respostas.filter(r=>r.quizId===q.id&&em[r.colabId]&&em[r.colabId].grupo===g)
      .sort((a,b)=>b.acertos-a.acertos||String(a.em).localeCompare(String(b.em)));
    rs.forEach((r,i)=>{const bonus=r.acertos>0&&i<3?QUIZ_BONUS[i]:0;out[r.id]={pts:QUIZ_PART+bonus,pos:i+1,bonus}});
  }));
  return out;
}
function placar(d,mes){
  const t={},qp=quizPontos(d);
  const get=id=>t[id]||(t[id]={aval:0,quiz:0,dias:0,nq:0});
  d.avaliacoes.forEach(a=>{if(a.mes===mes){const o=get(a.colabId);o.aval+=Number(a.pontos)||0;o.dias++}});
  d.respostas.forEach(r=>{if(r.mes===mes&&qp[r.id]){const o=get(r.colabId);o.quiz+=qp[r.id].pts;o.nq++}});
  Object.values(t).forEach(o=>o.total=o.aval+o.quiz);
  return t;
}
function ranking(d,mes,g){
  if(!d)return[];
  const t=placar(d,mes);
  const list=d.equipe.filter(c=>c.grupo===g&&(c.ativo||t[c.id])).map(c=>Object.assign({c},t[c.id]||{aval:0,quiz:0,dias:0,nq:0,total:0}));
  list.sort((a,b)=>b.total-a.total||b.aval-a.aval||String(a.c.nome).localeCompare(String(b.c.nome),'pt-BR'));
  let pos=0,prev=null;list.forEach((x,i)=>{if(prev===null||x.total!==prev){pos=i+1;prev=x.total}x.pos=pos});
  return list;
}
function premioDe(d,mes){return (d&&d.premios.find(p=>p.mes===mes))||{p1:'',p2:'',p3:''}}
function meses(d){const s=new Set([mesKey()]);if(d){d.avaliacoes.forEach(a=>a.mes&&s.add(a.mes));d.respostas.forEach(r=>r.mes&&s.add(r.mes));d.quizzes.forEach(q=>q.mes&&s.add(q.mes));d.premios.forEach(p=>p.mes&&s.add(p.mes))}return[...s].sort().reverse()}

/* Avaliações: salvamento automático em lote */
const PEND={};let pendT=null,salvando=false;
function setAval(c,dia,itens){
  const d=S.adm,id=c.id+'_'+dia;
  d.avaliacoes=d.avaliacoes.filter(a=>a.id!==id);
  if(itens!==null)d.avaliacoes.push({id,colabId:c.id,data:dia,mes:dia.slice(0,7),itens,pontos:ptsItens(c,itens)});
  PEND[id]={colabId:c.id,data:dia,itens,pontos:itens===null?0:ptsItens(c,itens)};
  clearTimeout(pendT);pendT=setTimeout(flush,900);
  render();
}
async function flush(){
  if(salvando){pendT=setTimeout(flush,500);return}
  const ids=Object.keys(PEND);if(!ids.length)return;
  const lote=ids.map(k=>PEND[k]);ids.forEach(k=>delete PEND[k]);
  salvando=true;
  try{await call('salvarAvaliacoes',adminPin,lote)}
  catch(e){lote.forEach(a=>{const k=a.colabId+'_'+a.data;if(!PEND[k])PEND[k]=a});toast('Não salvou: '+msg(e)+' Tentando de novo…');pendT=setTimeout(flush,4000)}
  salvando=false;render();
}

/* ---------- Confete ---------- */
function confete(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.id='confete';document.body.appendChild(c);
  const W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;c.width=W*dpr;c.height=H*dpr;
  const x=c.getContext('2d');x.scale(dpr,dpr);
  const cores=['#283897','#DA2020','#F2B632','#3FA7E0','#2BB673'];
  const ps=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*60,y:H*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*13-5,r:Math.random()*6+5,c:cores[Math.random()*cores.length|0],a:Math.random()*6,va:(Math.random()-.5)*.35}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t-t0<2300)requestAnimationFrame(f);else c.remove()})(t0);
}

function resizeImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=128,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);let q=.78,u=c.toDataURL('image/jpeg',q);while(u.length>20000&&q>.3){q-=.12;u=c.toDataURL('image/jpeg',q)}res(u)};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function freePin(){const used=new Set(S.adm.equipe.map(c=>c.pin));for(let i=0;i<500;i++){const p=String(Math.floor(Math.random()*10000)).padStart(4,'0');if(!used.has(p)&&new Set(p).size>2)return p}return ''}

   <div class="fld"><label for="f-nome">Nome</label><input id="f-nome" type="text" value="${esc(c?c.nome:'')}" autocomplete="off"></div>

   <div class="fld"><label for="f-tel">WhatsApp com DDD (opcional)</label><input id="f-tel" type="tel" inputmode="tel" placeholder="Ex.: 91 98888-7777" value="${esc(c?telFmt(c.telefone):'')}"><span class="hint">Com o número, o botão “Enviar PIN” abre direto na conversa da pessoa.</span></div>
   <label class="check" style="margin-bottom:14px"><input id="f-ativo" type="checkbox" ${!c||c.ativo?'checked':''}> Ativo (aparece no ranking e pode entrar)</label>
   <p class="ferr"></p>
   <div class="acts"><button class="btn alt" data-act="close">Cancelar</button><button class="btn" data-act="saveColab">Salvar</button></div>`);
  $('#f-foto').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{M.foto=await resizeImg(f);$('#fprev').innerHTML=avatar({foto:M.foto},72)}catch(err){ferr('Não foi possível ler essa imagem. Tente outra.')}});

}
function quizForm(id){
  const q=id?S.adm.quizzes.find(x=>x.id===id):null;
  M={id,perg:q?JSON.parse(JSON.stringify(q.perguntas)):[{p:'',ops:['','','',''],c:-1,e:''}]};

function lerPergs(){M.perg=M.perg.map((x,i)=>({p:($('#qp'+i)||{}).value||'',e:($('#qe'+i)||{}).value||'',ops:[0,1,2,3].map(j=>($('#qo'+i+'_'+j)||{}).value||''),c:(()=>{const s=document.querySelector(`input[name=qc${i}]:checked`);return s?+s.value:-1})()}))}

/* ---------- Ações ---------- */
async function pressKey(k){
  if(S.busy)return;
  const L=S.view==='adminLogin'?6:4;
  if(k==='del'){S.pin=S.pin.slice(0,-1);S.pinErr='';render();return}
  if(S.pin.length>=L)return;
  S.pin+=k;S.pinErr='';render();
  if(S.pin.length<L)return;
  const pin=S.pin;S.busy=true;render();
  try{
    if(S.view==='login'){const r=await call('entrar',pin);S.me={id:r.id,nome:r.nome,pin};LS.set('qsn_me',JSON.stringify(S.me));S.view='home';S.ctab='hoje';S.pub=null;S.busy=false;S.pin='';render();await carregar();return}
    else{await call('entrarGestao',pin);adminPin=pin;SS.set('qsn_gest',pin);S.view='admin';S.adm=null;S.busy=false;S.pin='';render();await carregarGestao();return}
  }catch(e){S.pinErr=msg(e)}
  S.pin='';S.busy=false;render();
}
const A={
  key:d=>pressKey(d.k),
  retry:()=>{S.status='loading';render();carregar()},
  refresh:()=>carregar(),
  reloadAdm:()=>carregarGestao(),
  goAdmin:()=>{S.view='adminLogin';S.pin='';S.pinErr='';render();scrollTo(0,0)},
  goTeam:()=>{S.view=S.me?'home':'login';S.pin='';S.pinErr='';render();if(S.me)carregar()},
  logout:()=>{S.me=null;LS.set('qsn_me',null);S.view='login';S.pin='';S.play=null;S.pub=null;render();carregar(true)},
  adminOut:()=>{adminPin=null;S.adm=null;SS.set('qsn_gest',null);S.view=S.me?'home':'login';render();carregar()},
  ctab:d=>{S.ctab=d.k;render();scrollTo(0,0)},
  chk:d=>{if(S.check.has(d.k))S.check.delete(d.k);else S.check.add(d.k);render();salvarCheck()},
  startQuiz:d=>{S.play={qid:d.id,i:0,esc:[],res:null};render();scrollTo(0,0)},
  pickQ:d=>{S.play.esc[S.play.i]=+d.i;render()},
  nextQ:()=>{S.play.i++;render();scrollTo(0,0)},
  prevQ:()=>{S.play.i--;render();scrollTo(0,0)},
  exitQuiz:()=>{S.play=null;S.ctab='quiz';render();scrollTo(0,0)},
  sendQuiz:async()=>{
    const P=S.play;S.busy=true;render();
    try{P.res=await call('responderQuiz',S.me.pin,P.qid,P.esc);S.busy=false;render();scrollTo(0,0);if(P.res.acertos/P.res.total>=.5)confete();carregar(true)}
    catch(e){S.busy=false;toast(msg(e));render()}
  },
  tab:d=>{S.tab=d.k;render()},
  dia:d=>{S.dia=passoUtil(S.dia,+d.k);render()},
  diaHoje:()=>{S.dia=ultimoUtil();render()},
  grupo:d=>{S.grupo=d.k;render()},
  crit:d=>{const c=S.adm.equipe.find(x=>x.id===d.id),a=avalDe(S.adm,c.id,S.dia),set=new Set(a?a.itens:[]);set.has(d.k)?set.delete(d.k):set.add(d.k);setAval(c,S.dia,[...set])},
  allOn:d=>{const c=S.adm.equipe.find(x=>x.id===d.id);setAval(c,S.dia,itensDe(c).map(i=>i[0]))},
  allOff:d=>{const c=S.adm.equipe.find(x=>x.id===d.id);setAval(c,S.dia,[])},
  clearAval:d=>{const c=S.adm.equipe.find(x=>x.id===d.id);setAval(c,S.dia,null)},
  tudoCerto:()=>{S.adm.equipe.filter(c=>c.grupo===S.grupo&&c.ativo&&!avalDe(S.adm,c.id,S.dia)).forEach(c=>setAval(c,S.dia,itensDe(c).map(i=>i[0])));toast('Marcado. Ajuste quem não cumpriu algum item.')},
  newColab:()=>colabForm(null),

  genPin:()=>{$('#f-pin').value=freePin()},

  saveColab:async(d,b)=>{

    if(!data.perguntas.length)return ferr('Escreva pelo menos 1 pergunta.');
    for(let i=0;i<data.perguntas.length;i++){const x=data.perguntas[i];if(x.ops.filter(o=>o.trim()).length<2)return ferr(`Pergunta ${i+1}: preencha pelo menos 2 alternativas.`);if(x.c<0||!x.ops[x.c].trim())return ferr(`Pergunta ${i+1}: marque a bolinha da alternativa certa.`)}
    if(!/^\d{4}-\d{2}$/.test(data.mes))return ferr('Escolha o mês do quiz.');
    busyBtn(b,true,'Salvando…');

  delQuiz:d=>{const n=S.adm.respostas.filter(r=>r.quizId===d.id).length;confirmModal('Excluir este quiz?',n?`Os pontos de ${n} resposta${n>1?'s':''} a este quiz também saem do ranking.`:'Ninguém respondeu ainda.','Excluir',async()=>{await acao('removerQuiz',d.id);toast('Quiz excluído')})},
  savePremios:async(d,b)=>{const p={mes:S.mesPremio,p1:$('#pr1').value.trim(),p2:$('#pr2').value.trim(),p3:$('#pr3').value.trim()};busyBtn(b,true,'Salvando…');try{await acao('salvarPremios',p);toast('Prêmios salvos')}catch(e){toast(msg(e));busyBtn(b,false,'Salvar prêmios')}},
  doConfirm:async(d,b)=>{if(!M.confirm)return;busyBtn(b,true);try{await M.confirm();closeModal()}catch(e){busyBtn(b,false);ferr(msg(e))}},
  close:closeModal,
  ovClose:(d,b,e)=>{if(e.target===b)closeModal()},
  changeAdminPin:()=>{M={};openModal(`<h2>Trocar PIN da gestão</h2><div class="fld"><label for="a-pin">Novo PIN (6 números)</label><input id="a-pin" type="tel" inputmode="numeric" maxlength="6" class="num"></div><p class="ferr"></p><div class="acts"><button class="btn alt" data-act="close">Cancelar</button><button class="btn" data-act="saveAdminPin">Salvar</button></div>`)},
  saveAdminPin:async(d,b)=>{const p=$('#a-pin').value.trim();if(!/^\d{6}$/.test(p))return ferr('Use exatamente 6 números.');busyBtn(b,true,'Salvando…');try{await call('trocarPinGestao',adminPin,p);adminPin=p;SS.set('qsn_gest',p);closeModal();toast('PIN da gestão atualizado')}catch(e){busyBtn(b,false,'Salvar');ferr(msg(e))}},
};
A.instalar=async()=>{if(!instalarEvt)return;const ev=instalarEvt;instalarEvt=null;ev.prompt();try{await ev.userChoice}catch(e){}render()};

/* Atualização forçada: compara a versão do app com a publicada */
let esperandoAtt=false;
function aplicarAtualizacao(){
  const ocupado=Object.keys(PEND).length||S.busy||S.play||$('#modal').innerHTML;
  if(ocupado){esperandoAtt=true;setTimeout(aplicarAtualizacao,3000);return}
  toast('Nova versão! Atualizando o app…');
  setTimeout(()=>location.reload(),700);
}
async function checarVersao(){
  if(esperandoAtt||DEMO)return;
  try{const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=(await r.json()).v;if(v&&v!==APP_VERSION)aplicarAtualizacao()}catch(e){}
}
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{setInterval(()=>{reg.update().catch(()=>{})},60000)}).catch(()=>{});
}
setInterval(()=>{if(document.visibilityState==='visible')checarVersao()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checarVersao()});
setTimeout(checarVersao,4000);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=A[b.dataset.act];if(!f)return;
  if(b.dataset.act!=='ovClose')e.preventDefault();
  f(b.dataset,b,e);
});
document.addEventListener('change',e=>{
  if(e.target.id==='selMesRk'){S.mesAdmin=e.target.value;render()}
  if(e.target.id==='selMesQz'){S.mesQuiz=e.target.value;render()}
  if(e.target.id==='selMesPr'){S.mesPremio=e.target.value;render()}
});
document.addEventListener('keydown',e=>{
  if($('#modal').innerHTML){if(e.key==='Escape')closeModal();return}
  if(S.view!=='login'&&S.view!=='adminLogin')return;
  if(/^\d$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace')pressKey('del');
});
setInterval(()=>{if(document.visibilityState!=='visible'||$('#modal').innerHTML||S.busy||S.play)return;if(S.view==='home')carregar(true);else if(S.view==='admin'&&adminPin&&!Object.keys(PEND).length&&S.tab!=='avaliar')carregarGestao()},60000);

/* ---------- Início ---------- */
render();
if(S.view==='admin')carregarGestao();
carregar();
try{if(new URLSearchParams(location.search).has('gestao')&&S.view!=='admin'){S.view='adminLogin';S.pin='';S.pinErr='';render()}}catch(e){}
